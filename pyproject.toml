[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "disaster-risk-score-model"
version = "0.1.0"
description = "Intelligent Data Solution for Disaster Risk Reduction (IDS-DRR): configurable flood risk scoring."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "CivicDataLab" }]
keywords = ["disaster-risk", "flood", "topsis", "sendai", "dpg"]
classifiers = [
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "geopandas>=0.14,<1",
    "jenkspy>=0.4,<1",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<2",
    "pandas>=2.2,<3",
    "pulp>=2.8,<3",
    "requests>=2.32,<3",
    "scikit-learn>=1.5,<2",
    "scipy>=1.12,<2",
    "seaborn>=0.13,<1",
    "tqdm>=4.66,<5",
]

[project.optional-dependencies]
dev = [
    "codespell>=2.3,<3",
    "pre-commit>=3.7,<5",
    "pytest>=8.3,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.12",
]

[project.scripts]
drsm = "disaster_risk_score_model.cli:main"

[tool.setuptools.packages.find]
include = ["disaster_risk_score_model*"]

[tool.setuptools.package-data]
"disaster_risk_score_model" = ["config_templates/*.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.codespell]
skip = ".git,*.csv,*.json,*.png,build,dist,*.egg-info,.venv"
# alos: Advanced Land Observing Satellite (a data source named in the docs).
# socio-economic: a valid hyphenation used in CODE_OF_CONDUCT.md.
ignore-words-list = "alos,socio-economic"

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "C901", "COM812", "D203", "D212", "D415", "EM",
    "ISC001", "PERF203", "PLR091", "Q000", "D1",
    "T201",  # `print` is the CLI's user-facing output channel.
    "TRY003",  # Validation messages live at the raise site; custom exception classes would be overkill.
]

[tool.ruff.lint.pep8-naming]
# Single capitals and DMU are standard Data Envelopment Analysis / linear-algebra notation.
extend-ignore-names = ["X", "Y", "DMU"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "D", "FBT003", "INP001", "PLR2004", "S", "TRY003"]
# contrib/ holds standalone, region-specific example scripts, not the generic importable core.
"contrib/*" = ["BLE001", "EXE001", "FBT001", "FBT002", "INP001"]
