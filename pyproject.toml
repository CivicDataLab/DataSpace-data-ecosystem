[tool.codespell]
skip = ".git,*.csv,*.json,*.png,*.geojson,build,dist,*.egg-info,.venv,collaboratives"
# alos: Advanced Land Observing Satellite (a data source named in the docs).
# socio-economic: a valid hyphenation used in CODE_OF_CONDUCT.md.
ignore-words-list = "alos,socio-economic"

[tool.ruff]
line-length = 119
target-version = "py311"
# collaboratives/ are separate git submodules with their own tooling; canonical_entities/*/{Geojson,csv}
# are generated data, not source.
extend-exclude = ["collaboratives", "canonical_entities/*/maps/Geojson", "canonical_entities/*/maps/csv"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "ANN", "C901", "COM812", "D203", "D212", "D415", "EM",
    "ISC001", "PERF203", "PLR091", "Q000", "D1",
    "T201",  # `print` is these scripts' user-facing output channel.
    "TRY003",  # Validation messages live at the raise site; custom exception classes would be overkill.
]

[tool.ruff.lint.per-file-ignores]
# canonical_entities/ holds standalone, region-specific tooling, not an importable package.
"canonical_entities/*" = ["BLE001", "EXE001", "FBT001", "FBT002", "INP001"]
