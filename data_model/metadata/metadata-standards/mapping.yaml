  - dublin_core_element: "Date Issued"
    dcat: "dcterms:issued"
    applies_to: "Dataset"
    requirement: "Mandatory"
    value_type: "Controlled"
    category: core
    dublin_core_doc: "https://www.dublincore.org/specifications/dublin-core/dcmi-terms/terms/issued/"
    dcat_doc: "https://www.w3.org/TR/vocab-dcat-3/#Property:resource_release_date"
  - dublin_core_element: "Date Modified"
    dcat: "dcterms:modified"
    applies_to: "Dataset"
    requirement: "Mandatory"
    value_type: "Controlled"
    category: core
    dublin_core_doc: "https://www.dublincore.org/specifications/dublin-core/dcmi-terms/terms/modified/"
    dcat_doc: "https://www.w3.org/TR/vocab-dcat-3/#Property:resource_update_date"
  - dublin_core_element: "Type"
    dcat: "dcterms:type"
    applies_to: "Dataset"
    requirement: "Mandatory"
    value_type: "Controlled"
    category: core
    dublin_core_doc: "https://www.dublincore.org/specifications/dublin-core/dcmi-terms/elements11/type/"
    dcat_doc: "https://www.w3.org/TR/vocab-dcat-3/#Property:resource_type"
  - dublin_core_element: "Extent"
