# TOPSIS composite risk score configuration.
# See docs/topsis_risk_score.md for methodology detail.
#
# I/O locations are NOT set here. The district lookup and the two output files
# are fixed names (district_objectid.csv, risk_score.csv, risk_score_district.csv)
# resolved under the run-time --data-dir (or RISK_MODEL_DATA_DIR).

[weights]
# Relative weights for each factor in the TOPSIS aggregation.
# Higher weight = greater influence on the composite risk score.
# Rationale: flood-hazard is the primary driver; exposure is a context factor.
flood_hazard        = 4
exposure            = 1
vulnerability       = 2
government_response = 2

[classification]
# Number of equal-width bins for the composite risk score (1 = lowest, n = highest risk).
n_bins = 5

# --- Optional enrichment sections below. -----------------------------------
# All of the following are optional: omit any of them and the pipeline still
# produces the core risk scores; they only add display/diagnostic columns to
# the district-level output.

[cumulative_vars]
# These columns get financial-year running cumulative sums recomputed inside the TOPSIS
# step (independently of the cumulative sums in govtresponse.py) for use as platform
# display indicators. Remove any column not present in your data.
variables = [
    "total_procurement_value",
    "disaster_fund_sanctions_value",
]

# District-level indicator columns and their aggregation rules.
# Keys are snake_case column names (kebab-cased automatically on output).
# Values are pandas aggregation functions: "sum", "mean", "max", "min", or "first".
# Add or remove rows to match the columns present in your data. The script only
# aggregates columns that actually exist, so extra rows are ignored harmlessly.
[indicators]
total_procurement_value                 = "sum"
disaster_fund_sanctions_value           = "first"
disaster_fund_procurement_value         = "sum"
total_procurement_value_fy_cumsum       = "sum"
disaster_fund_sanctions_value_fy_cumsum = "first"
flood_protection_failures               = "sum"
flood_protection_damaged                = "sum"
roads_damaged                           = "sum"
bridges_damaged                         = "sum"
total_population                        = "sum"
total_households                        = "sum"
inundation_intensity_sum                = "sum"
human_lives_lost                        = "sum"
population_affected_total               = "sum"
crop_area                               = "sum"
elderly_population                      = "sum"
schools_count                           = "sum"
health_centres_count                    = "sum"
road_length                             = "sum"
rail_length                             = "sum"
area_sqkm                               = "sum"
net_sown_area_ha                        = "sum"
no_sanitation_households_pct            = "mean"
piped_water_households_pct              = "mean"
electricity_access                      = "mean"
mean_sex_ratio                          = "mean"
drainage_density                        = "mean"
inundation_intensity_mean_nonzero       = "mean"
mean_rain                               = "mean"
efficiency                              = "mean"
topsis_score                            = "mean"
max_rain                                = "max"
financial_year                          = "first"

# Decimal places to round output columns to. Omit a column to leave it unrounded.
# Keys are snake_case column names (kebab-cased automatically on output).
[rounding]
electricity_access                = 1
mean_sex_ratio                    = 2
piped_water_households_pct        = 2
no_sanitation_households_pct      = 2
inundation_intensity_mean_nonzero = 2
inundation_intensity_sum          = 2
max_rain                          = 2
mean_rain                         = 2
elderly_population                = 0
total_population                  = 0
rail_length                       = 0
road_length                       = 0
crop_area                         = 0

# Optional, geography-specific post-processing of the final output. These
# sections are entirely optional — the generic model defines none, so nothing
# extra runs. Keys are snake_case column names (kebab-cased automatically on
# output). See contrib/india/example for usage.
#
# [derivations.scale]      # multiply a column in place by a constant factor
# inundation_pct = 100     # e.g. convert a 0-1 fraction to a percentage
#
# [derivations.sum]        # new column = row-wise sum of components (only if all present)
# total_infrastructure_damage = ["roads_damaged", "bridges_damaged"]
#
# [renames]                # rename output columns (missing names ignored)
# old_column_name = "new_column_name"
