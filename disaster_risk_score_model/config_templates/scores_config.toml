# Scores configuration: one section per factor score.
# Edit this file to match your input data's variables and methodology.
# I/O locations (data directory, input filename) are NOT set here — they are
# supplied at run time via --data-dir / --input-file (or the RISK_MODEL_DATA_DIR
# / RISK_MODEL_INPUT_FILE environment variables).
#
# Three structural columns are REQUIRED in the master input and use FIXED names
# (not configurable) — rename your source columns to match:
#   time_period  monthly time slice, ISO 8601 "YYYY-MM"
#   unit_id      stable unique id of the geographic unit being scored
#   parent_unit  the parent unit each row rolls up to in the TOPSIS step

# ===========================================================================
# Flood hazard score. See docs/score_hazard.md.
# ===========================================================================
[hazard.inputs]
# Columns to use as hazard input variables. Minimum 2 required.
# All must be non-negative floats present in the master input CSV.
variables = [
    "inundation_intensity_mean_nonzero",
    "inundation_intensity_sum",
    "drainage_density",
    "mean_rain",
    "max_rain",
]

[hazard.classification]
# Percentile cut-points that define the 5 hazard classes.
# Four thresholds divide the distribution into 5 bands.
quantile_thresholds = [0.35, 0.60, 0.80, 0.95]
classes             = [1, 2, 3, 4, 5]

[hazard.output]
file      = "factor_scores_l1_flood-hazard.csv"
plot_file = "hazard_distribution.png"

[hazard.plot]
figsize = [15, 6]
dpi     = 300

# ===========================================================================
# Exposure score. See docs/score_exposure.md.
# ===========================================================================
[exposure.inputs]
# Population/household columns to use. Minimum 1 required.
# MinMax scaling is applied per month, so absolute units do not matter.
variables = [
    "total_population",
    "total_households",
]

[exposure.classification]
# Class labels assigned from lowest to highest exposure.
classes = [1, 2, 3, 4, 5]

[exposure.output]
file = "factor_scores_l1_exposure.csv"

# ===========================================================================
# Vulnerability score (DEA). See docs/score_vulnerability.md.
#
# DEA requires both condition_vars and damage_vars. If damage data is
# unavailable, consider replacing the DEA with a simpler weighted index over
# condition_vars only.
# ===========================================================================
[vulnerability.inputs]
# Structural condition variables used as DEA inputs.
condition_vars = [
    "mean_sex_ratio",
    "schools_count",
    "health_centres_count",
    "rail_length",
    "road_length",
    "net_sown_area_ha",
    "electricity_access",
    "piped_water_households_pct",
    "no_sanitation_households_pct",
    "elderly_population",
    "flood_protection_failures",
]

# Observed flood damage variables used as DEA outputs.
damage_vars = [
    "human_lives_lost",
    "population_affected_total",
    "crop_area",
    "flood_protection_damaged",
    "roads_damaged",
    "bridges_damaged",
]

# Condition variables where a higher value means better resilience.
# These are inverted (1 − scaled value) before being passed to the DEA,
# so the model correctly penalises their absence.
inverted_inputs = [
    "schools_count",
    "health_centres_count",
    "rail_length",
    "road_length",
    "electricity_access",
    "piped_water_households_pct",
]

# Condition variables with negative polarity used in damage weighting.
neg_inputs = [
    "no_sanitation_households_pct",
    "elderly_population",
    "flood_protection_failures",
]

# Per-capita normalisation applied before scoring: variable = denominator_column.
[vulnerability.normalisation.per_capita]
population_affected_total = "total_population"
human_lives_lost          = "total_population"

# Per-area normalisation applied before scoring: variable = denominator_column.
# area_sqkm is the area of the geographic unit in square kilometres.
[vulnerability.normalisation.per_area]
crop_area                  = "net_sown_area_ha"
roads_damaged              = "area_sqkm"
bridges_damaged            = "area_sqkm"
flood_protection_failures  = "area_sqkm"
flood_protection_damaged   = "area_sqkm"
elderly_population          = "area_sqkm"
rail_length                = "area_sqkm"
schools_count              = "area_sqkm"
health_centres_count       = "area_sqkm"
road_length                = "area_sqkm"
net_sown_area_ha           = "area_sqkm"

[vulnerability.classification]
n_classes         = 5
# Minimum damage variable value for a unit to be considered significantly damaged.
damage_threshold  = 0.0001

[vulnerability.output]
file = "factor_scores_l1_vulnerability.csv"

# ===========================================================================
# Government response score. See docs/score_government_response.md.
#
# Score is inversely coded: high spending = class 1 (strongest response).
# ===========================================================================
[govtresponse.inputs]
# Monetary expenditure/procurement columns. Minimum 1 required.
# Financial-year cumulative sums are computed automatically before scoring.
# These are generic placeholders — rename them to match your data, e.g. a
# disaster relief fund or a national/regional disaster-response scheme.
variables = [
    "total_procurement_value",
    "disaster_fund_sanctions_value",
    "disaster_fund_procurement_value",
]

[govtresponse.fiscal_year]
# Month number on which the fiscal year starts (1 = January, 4 = April, 7 = July …).
# Default is 1 (calendar year). Set this to match your jurisdiction's fiscal calendar
# (for example, the India reference example under contrib/india uses 4 = April).
start_month = 1

[govtresponse.classification]
# Inverted labels: low spending maps to class 5 (weakest), high spending to class 1 (strongest).
classes = [5, 4, 3, 2, 1]

[govtresponse.output]
file = "factor_scores_l1_government-response.csv"
