[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cds-audit"
version = "0.1.0"
description = "Audit CivicDataSpace datasets against the dataset uploading guidelines and score them."
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["requests>=2.28", "PyYAML>=6.0"]

[project.optional-dependencies]
deep = ["openpyxl>=3.1", "pyarrow>=14", "shapely>=2.0"]
dev = ["pytest>=7", "openpyxl>=3.1"]

[project.scripts]
cds-audit = "cds_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cds_audit = ["rules.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
